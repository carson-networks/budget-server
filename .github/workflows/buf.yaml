name: Buf

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  buf:
    name: Lint and breaking change detection
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      # Keep `version` in sync with BUF_VERSION in the Makefile (proto-generate).
      - uses: bufbuild/buf-action@v1.4.0
        with:
          version: "1.66.1"
          input: proto
          github_token: ${{ secrets.GITHUB_TOKEN }}
          lint: true
          breaking: true
          format: true
          push: false
          pr_comment: true
