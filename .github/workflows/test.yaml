name: Run Tests

on:
  push:

jobs:
  test:
    name: Run all Go tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6.0.2

      - name: Set up tools
        uses: jdx/mise-action@v5.2.7
        with:
          cache: true

      - name: Run tests
        run: go test ./...
