syntax = "proto3";

package budget.v1;

option go_package = "github.com/carson-networks/budget-server/gen/budget/v1;budgetv1";

message BudgetRow {
  string category_id = 1;
  int32 month = 2;
  int32 year = 3;
  string amount = 4;
}

message ListBudgetsRequest {
  int32 start_month = 1;
  int32 start_year = 2;
  int32 end_month = 3;
  int32 end_year = 4;
}

message ListBudgetsResponse {
  repeated BudgetRow budgets = 1;
}

message SetBudgetRequest {
  string category_id = 1;
  int32 month = 2;
  int32 year = 3;
  string amount = 4;
  bool overwrite_future_months = 5;
}

message SetBudgetResponse {
  string category_id = 1;
  int32 month = 2;
  int32 year = 3;
  string amount = 4;
}

service BudgetService {
  rpc ListBudgets(ListBudgetsRequest) returns (ListBudgetsResponse);
  rpc SetBudget(SetBudgetRequest) returns (SetBudgetResponse);
}
