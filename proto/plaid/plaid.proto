syntax = "proto3";

package plaid.v1;
option go_package = "gen/plaid";

import "account/account.proto";
import "google/protobuf/timestamp.proto";

message SyncAccount {
  string plaid_account_id = 1;
  string name = 2;
  account.v1.AccountType type = 3;
  string sub_type = 4;
  string balance = 5;
}

message CreateLinkTokenRequest {}

message CreateLinkTokenResponse {
  string link_token = 1;
  google.protobuf.Timestamp expiration = 2;
}

message ExchangeTokenRequest {
  string public_token = 1;
  string institution_id = 2;
  string institution_name = 3;
  repeated SyncAccount accounts = 4;
}

message ExchangeTokenResponse {
  int32 status = 1;
}

service PlaidService {
  rpc CreateLinkToken(CreateLinkTokenRequest) returns (CreateLinkTokenResponse);
  rpc ExchangeToken(ExchangeTokenRequest) returns (ExchangeTokenResponse);
}
